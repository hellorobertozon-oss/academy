<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141B4D">
  <meta name="description" content="Logowanie do Xzone Academy dla sprzedawców i partnerów.">
  <title>Logowanie — Xzone Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./design-system/atomic-snippet-2026-10-8%20(1)/snipped.css">
  <link rel="stylesheet" href="./xzone-theme.css">
  <style>
    .login-page {
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 0, rgba(62, 222, 182, .12), transparent 34rem), var(--xzone-main);
    }
    .xzone-logo { display: block; width: 180px; height: auto; object-fit: contain; }
    .login-header {
      position: fixed;
      inset: 0 0 auto;
      width: 100%;
      justify-content: space-between;
      padding: 21px 48px;
      background: rgba(20, 27, 77, .9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }
    .back-link { white-space: nowrap; }
    .login-main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 132px 24px 50px;
    }
    .login-card {
      width: min(100%, 460px);
      padding: clamp(28px, 5vw, 46px);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(71, 69, 84, .2);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .2), inset 0 1px rgba(248, 248, 248, .06);
    }
    .login-title {
      margin: 0;
      color: var(--xzone-white);
      font-family: var(--font-display);
      font-size: clamp(54px, 8vw, 72px);
      font-weight: 400;
      letter-spacing: .01em;
      line-height: .95;
      text-transform: uppercase;
    }
    .login-description {
      margin: 15px 0 28px;
      color: var(--muted);
      font-family: var(--font-secondary);
      font-size: 16px;
      line-height: 1.55;
    }
    .login-form label {
      display: block;
      margin: 16px 0 7px;
      color: var(--xzone-white);
      font-family: var(--font-secondary);
      font-size: 13px;
      font-weight: 500;
    }
    .login-form input {
      width: 100%;
      min-height: 49px;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      background: #f1f1f1;
      color: var(--xzone-black);
      font-family: var(--font-primary);
      font-size: 14px;
    }
    .login-form input::placeholder { color: rgba(46, 46, 46, .6); }
    .forgot-password {
      display: block;
      width: fit-content;
      margin: 17px 0 0 auto;
      color: var(--xzone-accent);
      font-family: var(--font-secondary);
      font-size: 13px;
      text-decoration: none;
    }
    .forgot-password:hover { text-decoration: underline; }
    .login-submit {
      width: 100%;
      min-height: 58px;
      margin-top: 25px;
      font-family: var(--font-primary);
      font-size: 17px !important;
    }
    .login-status {
      min-height: 18px;
      margin: 13px 0 0;
      color: var(--muted);
      font-family: var(--font-secondary);
      font-size: 12px;
      line-height: 1.5;
    }
    .login-status:empty { display: none; }
    @media (max-width: 991px) {
      .login-header { padding: 18px 24px; }
    }
    @media (max-width: 560px) {
      .login-header { padding: 14px 16px; }
      .xzone-logo { width: 145px; }
      .back-link { padding: 8px 14px !important; font-size: 13px !important; }
      .login-main { padding: 112px 18px 30px; }
      .login-card { padding: 28px 23px; }
    }
  </style>
  <link rel="stylesheet" href="./xzone-boardui.css">
</head>
<body>
  <div class="login-page">
    <header class="header up login-header">
      <a class="logo" href="./index.html" aria-label="Wróć na stronę główną Xzone Academy">
        <img class="xzone-logo" src="./assets/xzone-logo.png" alt="Xzone Academy">
      </a>
      <a class="btn btn-solid is-header-btn btn-cloud back-link" href="./index.html">← Strona główna</a>
    </header>

    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <h1 class="login-title" id="login-title">Zaloguj się</h1>
        <p class="login-description">Zaloguj się do materiałów i wiedzy dla sprzedawców Xzone.</p>
        <form class="login-form" id="login-form">
          <label for="email">Adres e-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="twoj@email.pl" required>
          <label for="password">Hasło</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Wpisz hasło" required>
          <button class="btn btn-solid is-big login-submit" type="submit">Zaloguj się <span aria-hidden="true">→</span></button>
          <a class="forgot-password" href="#odzyskiwanie" id="forgot-password">Zapomniałem hasła</a>
          <p class="login-status" id="login-status" role="status"></p>
        </form>
      </section>
    </main>
  </div>
  <script>
    document.getElementById("forgot-password").addEventListener("click", (event) => {
      event.preventDefault();
      document.getElementById("login-status").textContent = "Odzyskiwanie hasła nie jest jeszcze podłączone.";
    });
    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("login-status").textContent = "To podgląd — logowanie nie jest jeszcze podłączone.";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Niebieskie UI gry — 5 komponentów</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#eff9ff;background:#171c2a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:30px 18px 50px}
.wrapper{width:min(840px,100%);margin:auto}
h1{font-size:clamp(1.15rem,2.6vw,1.65rem);line-height:1.3;margin:0 0 5px;font-weight:800}
.note{font-size:.89rem;color:#aab7ca;margin:0 0 22px}
.canvas{width:min(800px,100%);aspect-ratio:1;background:#61626d;border-radius:9px;overflow:hidden;box-shadow:0 16px 50px #0004;transition:background .2s}
.canvas.transparent{background:transparent;background-image:linear-gradient(45deg,#30394a 25%,transparent 25%),linear-gradient(-45deg,#30394a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#30394a 75%),linear-gradient(-45deg,transparent 75%,#30394a 75%);background-size:30px 30px;background-position:0 0,0 15px,15px -15px,-15px 0}
.canvas svg{display:block;width:100%;height:100%}
.tools{margin-top:20px;background:#242c3d;border:1px solid #35405a;border-radius:14px;padding:18px 19px 21px}
.tools h2{font-size:1rem;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px 22px}
.control{min-width:0;display:flex;flex-direction:column;gap:9px}
.control-head{display:flex;gap:9px;justify-content:space-between;align-items:center;font-size:.85rem;color:#e5f1ff}
.output{color:#57e4ff;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;cursor:pointer;accent-color:#32d3f7;margin:0}
input[type=number]{width:100%;min-height:38px;border:1px solid #455674;border-radius:8px;background:#161f2f;color:#fff;padding:8px 10px;font:inherit}
.actions{border-top:1px solid #3c475d;padding-top:16px;margin-top:19px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
button{background:#2acbef;border:0;border-radius:8px;color:#053b62;font-size:.85rem;font-weight:800;padding:10px 14px;cursor:pointer;transition:transform .15s,background .15s}
button:hover{background:#72e8fe;transform:translateY(-1px)}
button.secondary{background:#34445f;color:#d4e7fc}
button.secondary:hover{background:#415673}
.check{display:flex;align-items:center;gap:7px;font-size:.81rem;color:#b6cde3;cursor:pointer}
.check input{accent-color:#22d4ef;width:16px;height:16px}
.footer-note{font-size:.77rem;color:#93a1b8;margin-top:14px;line-height:1.5}
@media(max-width:640px){body{padding:16px 10px 32px}.tools{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.note{margin-bottom:13px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head>
<body>

</div>
<section class="tools" aria-label="Testowanie elementów">
<h2>Zmień wartości w podglądzie</h2>
<div class="grid">
<div class="control"><div class="control-head"><label for="progress">Pasek z gwiazdką</label><span class="output" id="progressLabel">54%</span></div><input id="progress" type="range" min="0" max="100" value="54"></div>
<div class="control"><div class="control-head"><label for="hearts">Segmenty serca</label><span class="output" id="heartsLabel">9/14</span></div><input id="hearts" type="range" min="0" max="14" value="9"></div>
<div class="control"><div class="control-head"><label for="energy">Energia</label><span class="output" id="energyLabel">42%</span></div><input id="energy" type="range" min="0" max="100" value="42"></div>
<div class="control"><div class="control-head"><label for="points">Punkty <span class="output" id="pointsLabel">6 547</span></label></div><input type="number" id="points" min="0" max="99999" value="6547"></div>
<div class="control"><div class="control-head"><label for="seconds">Pozostały czas</label><span class="output" id="timerLabel">00:54</span></div><input id="seconds" type="range" min="0" max="600" value="54"></div>
</div>
<div class="actions"><button id="playPause">▶ Uruchom czas</button><button id="reset" class="secondary">↺ Resetuj</button><button id="saveSvg" class="secondary">↓ Zapisz SVG</button><label class="check"><input id="transparentToggle" type="checkbox"> Podgląd bez szarego tła</label></div>
<div class="footer-note">Każdy element ma oddzielną grupę SVG i może być eksportowany niezależnie. W pliku ZIP znajdują się również osobne PNG/SVG.</div>
</section>
</main>
<script>// UI łatwo włączyć do gry. Wartości początkowe odpowiadają referencji.
const state = {progress:54, hearts:9, energy:42, points:6547, seconds:54};
const $ = id => document.getElementById(id);
const clamp = (n, a, b) => Math.max(a, Math.min(b, Number.isFinite(+n) ? +n : a));
const formatTime = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

function redraw(){
  $('topFillClip').setAttribute('width', 638 * state.progress / 100);
  $('energyFillClip').setAttribute('width', 650 * state.energy / 100);
  // Jeden segment = jeden punkt życia. Pełne serca są turkusowe, puste granatowe.
  document.querySelectorAll('#heartSegments rect').forEach((rect, i) => {
    rect.setAttribute('fill', i < state.hearts ? 'url(#cyanFill)' : '#0878bd');
    rect.setAttribute('opacity', i < state.hearts ? '1' : '.67');
  });
  $('scoreText').textContent = String(state.points);
  $('timerText').textContent = formatTime(state.seconds);
  $('progressLabel').textContent = `${state.progress}%`;
  $('heartsLabel').textContent = `${state.hearts}/14`;
  $('energyLabel').textContent = `${state.energy}%`;
  $('timerLabel').textContent = formatTime(state.seconds);
  $('pointsLabel').textContent = state.points.toLocaleString('pl-PL');
  for(const [id, val] of Object.entries({progress:state.progress,hearts:state.hearts,energy:state.energy,points:state.points,seconds:state.seconds})){
    const el = $(id); if(el && document.activeElement !== el) el.value=val;
  }
}
function setUI(key, value){
  const ranges={progress:[0,100],hearts:[0,14],energy:[0,100],points:[0,99999],seconds:[0,5999]};
  state[key] = Math.round(clamp(value,...ranges[key])); redraw();
}
window.gameUI={setProgress:v=>setUI('progress',v),setHearts:v=>setUI('hearts',v),setEnergy:v=>setUI('energy',v),setPoints:v=>setUI('points',v),setSeconds:v=>setUI('seconds',v),getState:()=>({...state})};
Object.keys(state).forEach(id=>$(id)?.addEventListener('input',event=>setUI(id,event.target.value)));
$('transparentToggle')?.addEventListener('change',e=>$('stage').classList.toggle('transparent',e.target.checked));
let tick=null;
$('playPause')?.addEventListener('click',()=>{
  if(tick){clearInterval(tick);tick=null;$('playPause').textContent='▶ Uruchom czas';return;}
  $('playPause').textContent='Ⅱ Pauza';
  tick=setInterval(()=>{
    if(state.seconds<=0){clearInterval(tick);tick=null;$('playPause').textContent='▶ Uruchom czas';return;}
    setUI('seconds', state.seconds-1);
  },1000);
});
$('reset')?.addEventListener('click',()=>{Object.assign(state,{progress:54,hearts:9,energy:42,points:6547,seconds:54});redraw();});
// Zapis całej kompozycji SVG. Eksporty pojedynczych komponentów znajdują się w ZIP.
$('saveSvg')?.addEventListener('click',()=>{
  const source=$('stage').querySelector('svg').cloneNode(true);
  source.setAttribute('xmlns','http://www.w3.org/2000/svg');
  source.setAttribute('width','800');source.setAttribute('height','800');
  source.removeAttribute('aria-label');
  const content=new XMLSerializer().serializeToString(source);
  const url=URL.createObjectURL(new Blob([content],{type:'image/svg+xml;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='game-ui-elements.svg';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});
redraw();
</script>
</body></html>
